<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>알뜰</title>
  <meta name="description" content="개인·그룹 공유 가계부 · 알뜰">
  <meta name="theme-color" content="#ffffff">
  <!-- iOS PWA (홈 화면에 추가 시 전체화면 앱처럼) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="알뜰">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <!--
    ☁️ Netlify 배포: 이 public/ 폴더가 사이트 루트(netlify.toml publish="public") → / 에서 열림
    Firebase: ① 이메일/비밀번호 로그인 ✅  ② Authentication > Authorized domains 에 배포 도메인 추가
    RTDB 규칙: database.rules.json 내용을 콘솔 > Realtime Database > 규칙에 붙여넣고 게시 (자세한 모델은 docs/deploy/rules.md)
      - 모든 가계부 데이터는 ws/{wsId} 아래에 분리 저장(개인/그룹 워크스페이스)
      - ws/{wsId} 는 해당 워크스페이스 members 에 속한 uid 만 read/write
      - users/codes/workspaces 는 합류·전환을 위해 로그인 사용자에게 열림
    ※ SDK는 compat 빌드 필수
  -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-pending">
  <!-- 로그인 (auth-pending: 첫 페인트부터 스플래시로 로그인창 깜빡임 방지 — onAuthStateChanged가 걷어냄) -->
  <div id="authScreen" class="auth-wrap">
    <div class="auth-hero"><img src="icons/wordmark-altteul.svg" class="auth-wordmark" alt="알뜰"><img src="icons/egg-garden.svg" class="auth-logo" alt=""></div>
    <p class="desc" id="authDesc">로그인하고 오늘도 알뜰하게~</p>
    <div class="seg" id="authModeSeg">
      <button id="modeLogin" class="on" onclick="setAuthMode('login')">로그인</button>
      <button id="modeSignup" onclick="setAuthMode('signup')">회원가입</button>
    </div>
    <div class="field" id="nameField" style="display:none;"><label>이름(별명)</label><input type="text" id="authName" class="input" placeholder="알뜰에 표시될 이름" autocomplete="nickname"></div>
    <div class="field"><label>이메일</label><input type="email" id="authEmail" class="input" placeholder="your@email.com" autocomplete="username"></div>
    <div class="field"><label>비밀번호</label><input type="password" id="authPassword" class="input" placeholder="6자 이상" autocomplete="current-password"></div>
    <div class="auth-opts" id="authOpts">
      <button type="button" class="auth-opt" id="optSaveId" role="switch" aria-checked="false" onclick="toggleAuthOpt('saveId')"><span>아이디 저장</span><span class="switch"><i></i></span></button>
      <button type="button" class="auth-opt" id="optAutoLogin" role="switch" aria-checked="false" onclick="toggleAuthOpt('autoLogin')"><span>자동 로그인</span><span class="switch"><i></i></span></button>
    </div>
    <button class="btn" id="authSubmit" onclick="submitAuth()">로그인</button>
    <p style="text-align:center;margin-top:14px;"><button type="button" class="link" onclick="openLoginHelpSheet()">아이디 · 비밀번호를 잊으셨나요?</button></p>
    <p class="authfoot">초대코드가 있다면 가입 후 <b>그룹</b>에 합류하세요</p>
  </div>

  <!-- 앱 -->
  <div id="app">
    <div class="topbar">
      <div class="brand" role="button" tabindex="0" onclick="openNews()" aria-label="소식"><img src="icons/icon.svg" class="brand-ic" alt=""><span class="notif-badge" id="newsBadge" hidden aria-label="새 소식"></span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="modeseg" id="modeSeg" role="tablist" aria-label="가계부/할일 전환">
          <button type="button" data-mode="ledger" class="on" onclick="setMode('ledger')">가계부</button>
          <button type="button" data-mode="todo" onclick="setMode('todo')">할일</button>
        </div>
        <button class="ws-chip" id="wsChip" onclick="openWorkspaceSheet()" aria-label="그룹 전환"><span class="dotk"></span>그룹</button>
        <button type="button" class="icon-btn" id="petcamBtn" onclick="toggleDockHidden()" title="펫캠 켜기/끄기" aria-label="펫캠 켜기/끄기" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 10.5l6-3.5v10l-6-3.5z"/></svg></button>
        <button type="button" class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="테마" aria-label="밝게/어둡게 전환"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </div>
    <div id="catdock"></div>
    <main class="content" id="content"></main>

    <nav class="tabbar" aria-label="주요 메뉴">
      <button class="tab" data-tab="assets" onclick="go('assets')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18" stroke-linecap="round"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>자산</button>
      <button class="tab on" data-tab="calendar" onclick="go('calendar')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4" stroke-linecap="round"/></svg>캘린더</button>
      <div class="fab-slot"><button class="fab" onclick="openTxSheet()" aria-label="거래 추가"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <button class="tab" data-tab="stats" onclick="go('stats')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>리포트</button>
      <button class="tab" data-tab="more" onclick="go('more')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>더보기</button>
    </nav>
  </div>

  <!-- 시트 -->
  <div id="overlay" onclick="closeSheet()" aria-hidden="true"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="x" onclick="closeSheet()" aria-label="닫기">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="catFx" class="fx" aria-hidden="true"></div>

    <script src="js/firebase.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/util.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script src="js/cats.js"></script>
  <script src="js/push.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
